# LiveKit Egress Configuration
# https://docs.livekit.io/realtime/egress/overview/

# API configuration
api_key: devkey
api_secret: secret
ws_url: ws://livekit:7880

# Health check port
health_port: 8080

# S3 storage for recordings (optional)
# s3:
#   access_key: your-access-key
#   secret: your-secret-key
#   region: us-east-1
#   bucket: streamlick-recordings

# File output directory (for local storage)
file_output:
  local: true
  output_dir: /recordings

# CPU limit for transcoding
cpu_cost:
  room_composite_cpu_cost: 3.0
  web_cpu_cost: 3.0
  track_composite_cpu_cost: 2.0
  track_cpu_cost: 1.0

# Logging
logging:
  level: info
