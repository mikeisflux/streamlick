<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StreamLick Composite Layout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }
    #wrapper {
      /* Scale down to fit browser - adjust scale as needed */
      transform: scale(0.5);
      transform-origin: top center;
    }
    #container {
      position: relative;
      width: 1920px;
      height: 1080px;
      border: 3px solid #333;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 100;
      background-color: #111;
      display: block;
    }
    /* Aggressively hide ALL video elements */
    video {
      position: fixed !important;
      top: -9999px !important;
      left: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0.001 !important;
      pointer-events: none !important;
      z-index: -1000 !important;
    }
    #video-container {
      position: fixed;
      top: -10000px;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
    #status {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      z-index: 1000;
      background: rgba(0,0,0,0.9);
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 400px;
      border: 1px solid #333;
    }
    #status.error { color: #f00; border-color: #f00; }
    #status.warning { color: #ff0; border-color: #ff0; }
    #status.success { color: #0f0; border-color: #0f0; }

    /* Controls panel */
    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.9);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #333;
      z-index: 1000;
    }
    #controls label {
      color: #fff;
      font-family: sans-serif;
      font-size: 12px;
      display: block;
      margin-bottom: 8px;
    }
    #controls select, #controls input {
      width: 150px;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      font-size: 12px;
    }
    #controls button {
      margin-top: 8px;
      padding: 8px 16px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    #controls button:hover {
      background: #6366f1;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="container">
      <canvas id="canvas" width="1920" height="1080"></canvas>
    </div>
  </div>
  <div id="video-container"></div>
  <div id="status">Initializing...</div>

  <!-- Controls panel for testing -->
  <div id="controls">
    <label>Layout:
      <select id="layoutSelect" onchange="window.setLayout(this.value)">
        <option value="1">1 - Solo</option>
        <option value="2">2 - Cropped 2x2</option>
        <option value="3">3 - Group Grid</option>
        <option value="4">4 - Spotlight</option>
        <option value="5">5 - News</option>
        <option value="6">6 - Screen Share</option>
        <option value="7">7 - PiP</option>
        <option value="8">8 - Cinema</option>
        <option value="9">9 - Grid + Gaps</option>
      </select>
    </label>
    <label>Background:
      <input type="text" id="bgInput" placeholder="Image URL...">
    </label>
    <button onclick="window.setBackground(document.getElementById('bgInput').value)">Set BG</button>
    <button onclick="window.setBackground(null)">Clear BG</button>
    <br>
    <button onclick="window.debugParticipants()">Debug</button>
  </div>

  <!-- WebRTC Adapter for browser compatibility -->
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>

  <script type="module">
    // ========================================
    // Import Ant Media SDK
    // ========================================
    import { WebRTCAdaptor } from './js/webrtc_adaptor.js';

    // ========================================
    // Configuration
    // ========================================
    const CANVAS_WIDTH = 1920;
    const CANVAS_HEIGHT = 1080;
    const FPS = 30;
    const WS_URL = 'wss://media.streamlick.com:5443/LiveApp/websocket';

    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId');
    const initialLayout = parseInt(urlParams.get('layout')) || 1;
    const initialBackground = urlParams.get('bg') || null;

    // ========================================
    // State
    // ========================================
    let currentLayout = initialLayout;
    let backgroundImage = null;
    let participants = []; // Array of { id, streamId, stream, videoElement, name, videoEnabled }
    let subscribedStreams = new Set(); // Track streams we've already subscribed to
    let webRTCAdaptor = null;
    let isPublishing = false;
    let isJoined = false;
    let compositeStreamId = null;
    let canvasStream = null;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const videoContainer = document.getElementById('video-container');

    function updateStatus(message, type = 'info') {
      console.log(`[Composite] ${message}`);
      statusEl.textContent = message;
      statusEl.className = type;
    }

    // ========================================
    // Layout Engine - All 10 layouts
    // ========================================
    function calculateLayoutPositions(layout, count) {
      const positions = [];
      if (count === 0) return positions;

      switch (layout) {
        case 1: // Solo - single participant centered at 60%
          if (count === 1) {
            const w = CANVAS_WIDTH * 0.6;
            const h = w * (9/16);
            positions.push({ x: (CANVAS_WIDTH-w)/2, y: (CANVAS_HEIGHT-h)/2, width: w, height: h });
          } else {
            return calculateGridPositions(count);
          }
          break;

        case 2: // Cropped - 2x2 grid
          {
            const cols = 2, rows = 2;
            const bw = CANVAS_WIDTH/cols, bh = CANVAS_HEIGHT/rows;
            for (let i = 0; i < count && i < 4; i++) {
              positions.push({ x: (i%cols)*bw, y: Math.floor(i/cols)*bh, width: bw, height: bh });
            }
          }
          break;

        case 3: // Group (auto grid)
          return calculateGridPositions(count);

        case 4: // Spotlight - one large + small boxes above
          if (count === 1) {
            positions.push({ x: 0, y: 0, width: CANVAS_WIDTH, height: CANVAS_HEIGHT });
          } else {
            const topH = CANVAS_HEIGHT * 0.25;
            const mainH = CANVAS_HEIGHT * 0.75;
            positions.push({ x: 0, y: topH, width: CANVAS_WIDTH, height: mainH });
            const thumbW = CANVAS_WIDTH / Math.min(3, count-1);
            for (let i = 1; i < count; i++) {
              positions.push({ x: (i-1)*thumbW, y: 0, width: thumbW, height: topH });
            }
          }
          break;

        case 5: // News - side by side
          {
            const newsW = CANVAS_WIDTH / Math.max(2, count);
            for (let i = 0; i < count; i++) {
              positions.push({ x: i*newsW, y: 0, width: newsW, height: CANVAS_HEIGHT });
            }
          }
          break;

        case 6: // Screen Share - thumbnails on top (12%)
          {
            const topBarH = CANVAS_HEIGHT * 0.12;
            const thumbW = count > 0 ? CANVAS_WIDTH / count : CANVAS_WIDTH;
            for (let i = 0; i < count; i++) {
              positions.push({ x: i * thumbW, y: 0, width: thumbW, height: topBarH });
            }
          }
          break;

        case 7: // Picture-in-Picture
          if (count === 1) {
            positions.push({ x: 0, y: 0, width: CANVAS_WIDTH, height: CANVAS_HEIGHT });
          } else {
            positions.push({ x: 0, y: 0, width: CANVAS_WIDTH, height: CANVAS_HEIGHT });
            const pipW = 320, pipH = 180, gap = 20;
            for (let i = 1; i < count; i++) {
              positions.push({
                x: CANVAS_WIDTH - pipW - gap,
                y: CANVAS_HEIGHT - (pipH + gap) * i,
                width: pipW,
                height: pipH
              });
            }
          }
          break;

        case 8: // Cinema - wide format
          {
            const boxW = count > 1 ? CANVAS_WIDTH / 2 : CANVAS_WIDTH;
            for (let i = 0; i < count; i++) {
              positions.push({ x: i * boxW, y: 0, width: boxW, height: CANVAS_HEIGHT });
            }
          }
          break;

        case 9: // Video Grid with gaps
          {
            const cols = Math.ceil(Math.sqrt(count));
            const rows = Math.ceil(count / cols);
            const gap = 8;
            const boxW = (CANVAS_WIDTH - gap * (cols + 1)) / cols;
            const boxH = (CANVAS_HEIGHT - gap * (rows + 1)) / rows;
            for (let i = 0; i < count; i++) {
              const col = i % cols;
              const row = Math.floor(i / cols);
              positions.push({
                x: gap + col * (boxW + gap),
                y: gap + row * (boxH + gap),
                width: boxW,
                height: boxH
              });
            }
          }
          break;

        default:
          return calculateGridPositions(count);
      }
      return positions;
    }

    function calculateGridPositions(count) {
      const positions = [];
      if (count === 0) return positions;
      const cols = Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count / cols);
      const bw = CANVAS_WIDTH / cols;
      const bh = CANVAS_HEIGHT / rows;
      for (let i = 0; i < count; i++) {
        positions.push({ x: (i%cols)*bw, y: Math.floor(i/cols)*bh, width: bw, height: bh });
      }
      return positions;
    }

    // ========================================
    // Canvas Rendering
    // ========================================
    let frameCount = 0;
    let lastStatTime = Date.now();

    function renderFrame() {
      frameCount++;
      const now = Date.now();

      // Log stats every 5 seconds
      if (now - lastStatTime > 5000) {
        const fps = Math.round(frameCount / 5);
        console.log(`[Composite] Stats: ${fps} fps, ${participants.length} participants, layout=${currentLayout}, publishing=${isPublishing}`);
        frameCount = 0;
        lastStatTime = now;
      }

      // Clear canvas with dark background
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Draw background image if available
      if (backgroundImage && backgroundImage.complete && backgroundImage.naturalWidth > 0) {
        ctx.drawImage(backgroundImage, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      }

      // Calculate positions for current layout
      const positions = calculateLayoutPositions(currentLayout, participants.length);

      // Draw each participant
      participants.forEach((p, i) => {
        if (i >= positions.length) return;
        const pos = positions[i];
        const video = p.videoElement;
        const cornerRadius = 16;

        // Rounded rectangle helper
        function drawRoundRect(x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
        }

        const hasVideo = video && video.readyState >= 2 && video.videoWidth > 0 && p.videoEnabled !== false;

        if (hasVideo) {
          // Calculate cover-fit dimensions (crop to fill)
          const vAspect = video.videoWidth / video.videoHeight;
          const bAspect = pos.width / pos.height;
          let sx = 0, sy = 0, sw = video.videoWidth, sh = video.videoHeight;

          if (vAspect > bAspect) {
            // Video is wider - crop sides
            sw = video.videoHeight * bAspect;
            sx = (video.videoWidth - sw) / 2;
          } else {
            // Video is taller - crop top/bottom
            sh = video.videoWidth / bAspect;
            sy = (video.videoHeight - sh) / 2;
          }

          // Draw video with rounded corners
          ctx.save();
          drawRoundRect(pos.x, pos.y, pos.width, pos.height, cornerRadius);
          ctx.clip();
          ctx.drawImage(video, sx, sy, sw, sh, pos.x, pos.y, pos.width, pos.height);
          ctx.restore();
        } else {
          // Draw placeholder tile with avatar
          ctx.save();
          drawRoundRect(pos.x, pos.y, pos.width, pos.height, cornerRadius);
          ctx.clip();
          ctx.fillStyle = '#1e2330';
          ctx.fillRect(pos.x, pos.y, pos.width, pos.height);
          ctx.restore();

          // Draw avatar circle (30% of tile)
          const cx = pos.x + pos.width / 2;
          const cy = pos.y + pos.height / 2;
          const avatarSize = Math.min(pos.width, pos.height) * 0.3;
          const avatarRadius = avatarSize / 2;

          // Avatar ring
          ctx.beginPath();
          ctx.arc(cx, cy, avatarRadius + 3, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.fill();

          // Avatar background
          ctx.beginPath();
          ctx.arc(cx, cy, avatarRadius, 0, Math.PI * 2);
          ctx.fillStyle = '#374151';
          ctx.fill();

          // Avatar initial
          const name = p.name || 'Guest';
          const initial = name.charAt(0).toUpperCase();
          ctx.fillStyle = '#fff';
          ctx.font = `bold ${Math.min(avatarRadius * 0.9, 72)}px -apple-system, BlinkMacSystemFont, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(initial, cx, cy);
        }

        // Draw name tag pill
        const displayName = p.name || 'Guest';
        const tagHeight = 32;
        const tagPadding = 14;
        const tagY = pos.y + pos.height - tagHeight - 16;
        const tagX = pos.x + 16;

        ctx.font = 'bold 15px -apple-system, BlinkMacSystemFont, sans-serif';
        const textWidth = ctx.measureText(displayName).width;
        const tagWidth = textWidth + tagPadding * 2;
        const tagRadius = tagHeight / 2;

        // Tag background
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.beginPath();
        ctx.moveTo(tagX + tagRadius, tagY);
        ctx.lineTo(tagX + tagWidth - tagRadius, tagY);
        ctx.arc(tagX + tagWidth - tagRadius, tagY + tagRadius, tagRadius, -Math.PI/2, Math.PI/2);
        ctx.lineTo(tagX + tagRadius, tagY + tagHeight);
        ctx.arc(tagX + tagRadius, tagY + tagRadius, tagRadius, Math.PI/2, -Math.PI/2);
        ctx.fill();

        // Tag text
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(displayName, tagX + tagPadding, tagY + tagHeight/2 + 1);
      });

      // Draw status overlay (can be hidden in production)
      const showDebug = true;
      if (showDebug) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(10, 10, 380, 28);
        ctx.fillStyle = isPublishing ? '#00ff00' : '#ff4444';
        ctx.font = 'bold 13px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${isPublishing ? '● LIVE' : '○ OFFLINE'} | ${participants.length} participants | Layout: ${currentLayout}`, 18, 24);
      }

      requestAnimationFrame(renderFrame);
    }

    // ========================================
    // WebRTC Connection
    // ========================================
    function initWebRTC() {
      if (!roomId) {
        updateStatus('ERROR: No roomId in URL', 'error');
        return;
      }

      compositeStreamId = `${roomId}_composite`;
      updateStatus(`Connecting to room: ${roomId}`, 'warning');

      // Capture canvas stream BEFORE creating adaptor
      canvasStream = canvas.captureStream(FPS);
      console.log('[Composite] Canvas stream captured:', canvasStream.getTracks().map(t => `${t.kind}:${t.readyState}`));

      webRTCAdaptor = new WebRTCAdaptor({
        websocket_url: WS_URL,
        mediaConstraints: { video: false, audio: false },
        localStream: canvasStream,
        peerconnection_config: {
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        },
        sdp_constraints: {
          OfferToReceiveAudio: true,
          OfferToReceiveVideo: true
        },
        callback: handleCallback,
        callbackError: handleError
      });
    }

    // Extract participant ID from various stream ID formats
    function extractParticipantId(streamId) {
      if (!streamId) return null;
      // Skip composite streams
      if (streamId.includes('composite')) return null;
      // Stream ID format: roomId_participantId
      const parts = streamId.split('_');
      if (parts.length >= 2) {
        return parts.slice(1).join('_');
      }
      return streamId;
    }

    function handleCallback(info, obj) {
      console.log('[Composite] Callback:', info, obj);

      switch (info) {
        case 'initialized':
          updateStatus('WebSocket connected, joining room...', 'warning');
          // Use joinRoom like the host does
          webRTCAdaptor.joinRoom(roomId, compositeStreamId, 'publish');
          break;

        case 'joinedTheRoom':
          isJoined = true;
          updateStatus(`Joined room. Streams: ${obj.streams?.length || 0}`, 'warning');

          // Publish our canvas stream
          console.log('[Composite] Publishing canvas as:', compositeStreamId);
          webRTCAdaptor.publish(compositeStreamId, null, null, null, compositeStreamId, roomId);

          // Subscribe to existing streams - but only participant streams, not the room itself
          if (obj.streams && obj.streams.length > 0) {
            obj.streams.forEach(streamId => {
              const participantId = extractParticipantId(streamId);
              if (participantId && !subscribedStreams.has(participantId)) {
                console.log('[Composite] Subscribing to existing stream:', streamId, 'participant:', participantId);
                subscribedStreams.add(participantId);
                webRTCAdaptor.play(streamId, null, roomId);
              }
            });
          }
          break;

        case 'publish_started':
          isPublishing = true;
          updateStatus(`PUBLISHING: ${compositeStreamId}`, 'success');
          break;

        case 'publish_finished':
          isPublishing = false;
          updateStatus('Publishing stopped', 'warning');
          break;

        case 'newStreamAvailable':
          console.log('[Composite] New stream:', obj.streamId, obj);
          const newStreamParticipant = extractParticipantId(obj.streamId);
          if (newStreamParticipant && obj.stream) {
            addParticipant(newStreamParticipant, obj.stream);
          }
          break;

        case 'newTrackAvailable':
          console.log('[Composite] New track:', obj.streamId, obj.track?.kind);
          const newTrackParticipant = extractParticipantId(obj.streamId);
          if (newTrackParticipant && obj.stream) {
            addParticipant(newTrackParticipant, obj.stream);
          }
          break;

        case 'subtrackAdded':
          // New participant joined - subscribe if we haven't already
          const subtrackParticipant = extractParticipantId(obj.trackId);
          if (subtrackParticipant && !subscribedStreams.has(subtrackParticipant)) {
            console.log('[Composite] Subtrack added, subscribing:', obj.trackId, 'participant:', subtrackParticipant);
            subscribedStreams.add(subtrackParticipant);
            webRTCAdaptor.play(obj.trackId, null, roomId);
          }
          break;

        case 'leavedFromRoom':
        case 'streamLeaved':
          const leftId = extractParticipantId(obj.streamId || obj) || obj.streamId || obj;
          subscribedStreams.delete(leftId);
          removeParticipant(leftId);
          break;

        case 'play_started':
          console.log('[Composite] Play started:', obj.streamId);
          break;

        case 'ice_connection_state_changed':
          console.log('[Composite] ICE state:', obj.state, obj.streamId);
          break;
      }
    }

    function handleError(error, message) {
      // Ignore non-critical errors
      if (error === 'already_playing' || error === 'no_stream_exist') {
        console.log('[Composite] Ignoring expected error:', error);
        return;
      }
      console.error('[Composite] Error:', error, message);
      updateStatus(`ERROR: ${error} - ${message}`, 'error');
    }

    function addParticipant(participantId, stream) {
      // Check if already exists
      let participant = participants.find(p => p.id === participantId);

      if (participant) {
        console.log('[Composite] Updating existing participant:', participantId);
        participant.stream = stream;
        if (participant.videoElement) {
          participant.videoElement.srcObject = stream;
          participant.videoElement.play().catch(e => console.warn('Replay error:', e));
        }
        return;
      }

      console.log('[Composite] Adding NEW participant:', participantId);

      // Create hidden video element
      const video = document.createElement('video');
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.srcObject = stream;

      // Add to hidden container
      videoContainer.appendChild(video);

      video.onloadedmetadata = () => {
        console.log('[Composite] Video ready:', participantId, video.videoWidth, 'x', video.videoHeight);
        video.play().catch(e => console.warn('Play error:', e));
      };

      // Retry play after delay
      setTimeout(() => {
        if (video.paused && video.srcObject) {
          video.play().catch(e => console.warn('Retry play:', e));
        }
      }, 500);

      participants.push({
        id: participantId,
        stream: stream,
        videoElement: video,
        name: null,
        videoEnabled: true
      });

      updateStatus(`${participants.length} participant(s) | Publishing: ${isPublishing}`, isPublishing ? 'success' : 'warning');
    }

    function removeParticipant(participantId) {
      const idx = participants.findIndex(p => p.id === participantId);
      if (idx !== -1) {
        const p = participants[idx];
        if (p.videoElement) {
          p.videoElement.srcObject = null;
          p.videoElement.remove();
        }
        participants.splice(idx, 1);
        console.log('[Composite] Removed:', participantId, 'Remaining:', participants.length);
        updateStatus(`${participants.length} participant(s)`, isPublishing ? 'success' : 'warning');
      }
    }

    // ========================================
    // External Control API
    // ========================================
    window.setBackground = function(url) {
      console.log('[Composite] Setting background:', url);
      if (!url) {
        backgroundImage = null;
        return;
      }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { backgroundImage = img; console.log('[Composite] Background loaded'); };
      img.onerror = () => console.error('[Composite] Background failed:', url);
      img.src = url;
    };

    window.setLayout = function(id) {
      currentLayout = parseInt(id) || 1;
      console.log('[Composite] Layout:', currentLayout);
    };

    window.setParticipantName = function(id, name) {
      const p = participants.find(p => p.id === id || p.streamId?.includes(id));
      if (p) { p.name = name; console.log('[Composite] Set name:', id, name); }
    };

    window.setParticipantVideo = function(id, enabled) {
      const p = participants.find(p => p.id === id || p.streamId?.includes(id));
      if (p) { p.videoEnabled = enabled; console.log('[Composite] Set video:', id, enabled); }
    };

    window.getState = () => ({
      roomId,
      compositeStreamId,
      layout: currentLayout,
      isPublishing,
      isJoined,
      participantCount: participants.length,
      participants: participants.map(p => ({ id: p.id, name: p.name, videoEnabled: p.videoEnabled }))
    });

    // PostMessage handler for external control
    window.addEventListener('message', (e) => {
      const { type, data } = e.data || {};
      if (type === 'setBackground') window.setBackground(data.url);
      if (type === 'setLayout') window.setLayout(data.layoutId);
      if (type === 'setParticipantName') window.setParticipantName(data.participantId, data.name);
      if (type === 'setParticipantVideo') window.setParticipantVideo(data.participantId, data.enabled);
    });

    // ========================================
    // Initialize
    // ========================================
    window.onload = () => {
      console.log('[Composite] Initializing...');
      console.log('[Composite] Room:', roomId);
      console.log('[Composite] Layout:', initialLayout);
      console.log('[Composite] Background:', initialBackground);

      if (initialBackground) {
        window.setBackground(initialBackground);
      }

      // Start render loop FIRST
      requestAnimationFrame(renderFrame);

      // Then initialize WebRTC
      if (roomId) {
        initWebRTC();
      } else {
        updateStatus('ERROR: No roomId parameter', 'error');
      }
    };

    // Debug helper
    window.debugParticipants = () => {
      participants.forEach((p, i) => {
        const v = p.videoElement;
        console.log(`P${i}:`, {
          id: p.id,
          name: p.name,
          streamId: p.streamId,
          readyState: v?.readyState,
          videoWidth: v?.videoWidth,
          videoHeight: v?.videoHeight,
          paused: v?.paused
        });
      });
    };
  </script>
</body>
</html>
