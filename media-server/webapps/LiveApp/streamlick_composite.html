<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Streamlick Compositor</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    #compositor {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
    }

    /* Background layer */
    #background-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #background-layer.color {
      background: var(--bg-color, #1a1a2e);
    }

    #background-layer img,
    #background-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Participants layer */
    #participants-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Participant tile */
    .participant-tile {
      position: absolute;
      overflow: hidden;
      border-radius: 16px;
      background: #1a1a2e;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .participant-tile.has-border {
      border: 4px solid var(--border-color, #10b981);
    }

    .participant-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .participant-tile .avatar {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
    }

    .participant-tile .avatar-letter {
      font-size: 72px;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .participant-tile .name-tag {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      max-width: calc(100% - 32px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .participant-tile .muted-icon {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      background: rgba(239, 68, 68, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .participant-tile .muted-icon svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    /* Overlays layer */
    #overlays-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }

    /* Logo */
    #logo-overlay {
      position: absolute;
      top: 32px;
      right: 32px;
      max-width: 240px;
      max-height: 100px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #logo-overlay.visible {
      opacity: 1;
    }

    /* Lower third */
    #lower-third {
      position: absolute;
      bottom: 100px;
      left: 80px;
      max-width: 800px;
      opacity: 0;
      transform: translateX(-20px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #lower-third.visible {
      opacity: 1;
      transform: translateX(0);
    }

    #lower-third .content {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
      backdrop-filter: blur(8px);
      padding: 20px 32px;
      border-radius: 12px;
      color: white;
    }

    #lower-third .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    #lower-third .subtitle {
      font-size: 18px;
      opacity: 0.9;
    }

    /* Live indicator */
    #live-indicator {
      position: absolute;
      top: 32px;
      left: 32px;
      background: #ef4444;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #live-indicator.visible {
      opacity: 1;
      animation: pulse-live 2s infinite;
    }

    @keyframes pulse-live {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Ticker/Banner */
    #ticker {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: rgba(0, 0, 0, 0.8);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #ticker.visible {
      opacity: 1;
    }

    #ticker .ticker-content {
      position: absolute;
      white-space: nowrap;
      color: white;
      font-size: 20px;
      line-height: 48px;
      animation: ticker-scroll 30s linear infinite;
    }

    @keyframes ticker-scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Countdown timer */
    #countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 200px;
      font-weight: 900;
      color: white;
      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #countdown.visible {
      opacity: 1;
    }

    /* Hidden video elements for streams */
    #hidden-streams {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div id="compositor">
    <!-- Background -->
    <div id="background-layer" class="color"></div>

    <!-- Participants -->
    <div id="participants-layer"></div>

    <!-- Overlays -->
    <div id="overlays-layer">
      <div id="live-indicator">LIVE</div>
      <img id="logo-overlay" src="" alt="">
      <div id="lower-third">
        <div class="content">
          <div class="title"></div>
          <div class="subtitle"></div>
        </div>
      </div>
      <div id="ticker">
        <div class="ticker-content"></div>
      </div>
      <div id="countdown"></div>
    </div>

    <!-- Hidden stream elements -->
    <div id="hidden-streams"></div>
  </div>

  <script>
    /**
     * Streamlick Server Compositor
     *
     * Runs in headless Chrome on Ant Media server.
     * Receives commands via WebSocket from backend.
     * Subscribes to participant streams via per-stream WebSocket connections.
     * Composites them on a hidden canvas with audio mixing.
     * Publishes composite output back to Ant Media as a single stream.
     * Stream persists independently of any host connection.
     */

    // ==========================================================================
    // CONFIGURATION
    // ==========================================================================

    const CONFIG = {
      broadcastId: new URLSearchParams(window.location.search).get('broadcastId') || 'test',
      backendWs: new URLSearchParams(window.location.search).get('backendWs') || 'ws://localhost:3001',
      antmediaWs: new URLSearchParams(window.location.search).get('antmediaWs') || 'wss://media.streamlick.com:5443/LiveApp/websocket',
      compositorSecret: new URLSearchParams(window.location.search).get('compositorSecret') || 'hHr20r6DjMVVen5RJfmOzzorFOyitmiK',
    };

    console.log('[Compositor] Starting with config:', CONFIG);

    // ==========================================================================
    // STATE
    // ==========================================================================

    const state = {
      isLive: false,
      layout: 'grid',
      backgroundColor: '#1a1a2e',
      backgroundType: 'color',
      backgroundUrl: null,
      logoUrl: null,
      logoVisible: false,
      lowerThird: { visible: false, title: '', subtitle: '' },
      ticker: { visible: false, text: '' },
      countdown: { visible: false, seconds: 0 },
      participants: [],
      streams: new Map(),      // streamId -> MediaStream
      videoElements: new Map(), // streamId -> HTMLVideoElement (for canvas drawing)
    };

    // Per-stream WebRTC + WebSocket connections (one per subscribed stream)
    const streamPeerConnections = new Map(); // streamId -> RTCPeerConnection
    const streamWebSockets = new Map();      // streamId -> WebSocket

    // Composite output
    let outputCanvas = null;
    let outputCtx = null;
    let audioContext = null;
    let audioMixer = null;       // GainNode -> destinationNode
    let audioDestination = null; // MediaStreamAudioDestinationNode
    const audioSources = new Map(); // streamId -> MediaStreamAudioSourceNode
    let canvasRenderLoop = null;

    // AMS publish connection (for composite output)
    let publishWs = null;
    let publishPc = null;
    let outputStreamId = null;
    let isPublishing = false;

    // ==========================================================================
    // LAYOUT ENGINE
    // ==========================================================================

    const LAYOUTS = {
      single: (count, w = 1920, h = 1080) => {
        if (count === 0) return [];
        const padding = 48;
        return [{ x: padding, y: padding, width: w - padding * 2, height: h - padding * 2 }];
      },

      grid: (count, w = 1920, h = 1080) => {
        if (count === 0) return [];
        const padding = 48;
        const gap = 24;
        const cols = count === 1 ? 1 : count <= 4 ? 2 : count <= 9 ? 3 : 4;
        const rows = Math.ceil(count / cols);
        const cellW = (w - padding * 2 - gap * (cols - 1)) / cols;
        const cellH = (h - padding * 2 - gap * (rows - 1)) / rows;

        return Array.from({ length: count }, (_, i) => ({
          x: padding + (i % cols) * (cellW + gap),
          y: padding + Math.floor(i / cols) * (cellH + gap),
          width: cellW,
          height: cellH,
        }));
      },

      spotlight: (count, w = 1920, h = 1080) => {
        if (count === 0) return [];
        if (count === 1) return LAYOUTS.single(1, w, h);

        const padding = 48;
        const gap = 24;
        const mainW = (w - padding * 2) * 0.72;
        const sideW = (w - padding * 2) * 0.28 - gap;
        const sideCount = count - 1;
        const sideH = (h - padding * 2 - gap * (sideCount - 1)) / sideCount;

        return [
          { x: padding, y: padding, width: mainW, height: h - padding * 2 },
          ...Array.from({ length: sideCount }, (_, i) => ({
            x: padding + mainW + gap,
            y: padding + i * (sideH + gap),
            width: sideW,
            height: sideH,
          })),
        ];
      },

      'side-by-side': (count, w = 1920, h = 1080) => {
        if (count === 0) return [];
        if (count === 1) return LAYOUTS.single(1, w, h);

        const padding = 48;
        const gap = 24;
        const cellW = (w - padding * 2 - gap) / 2;
        const cellH = h - padding * 2;

        return Array.from({ length: Math.min(count, 2) }, (_, i) => ({
          x: padding + i * (cellW + gap),
          y: padding,
          width: cellW,
          height: cellH,
        }));
      },

      'picture-in-picture': (count, w = 1920, h = 1080) => {
        if (count === 0) return [];
        if (count === 1) return LAYOUTS.single(1, w, h);

        const padding = 48;
        const pipW = 400;
        const pipH = 225;

        return [
          { x: padding, y: padding, width: w - padding * 2, height: h - padding * 2 },
          { x: w - pipW - padding, y: h - pipH - padding, width: pipW, height: pipH },
        ];
      },

      'featured-left': (count, w = 1920, h = 1080) => {
        if (count === 0) return [];
        if (count === 1) return LAYOUTS.single(1, w, h);

        const padding = 48;
        const gap = 24;
        const mainW = (w - padding * 2) * 0.65;
        const sideW = (w - padding * 2) * 0.35 - gap;
        const sideCount = Math.min(count - 1, 3);
        const sideH = (h - padding * 2 - gap * (sideCount - 1)) / sideCount;

        return [
          { x: padding, y: padding, width: mainW, height: h - padding * 2 },
          ...Array.from({ length: sideCount }, (_, i) => ({
            x: padding + mainW + gap,
            y: padding + i * (sideH + gap),
            width: sideW,
            height: sideH,
          })),
        ];
      },

      'news-panel': (count, w = 1920, h = 1080) => {
        if (count === 0) return [];
        const padding = 48;
        const gap = 24;
        const bottomH = 200;

        if (count === 1) {
          return [{ x: padding, y: padding, width: w - padding * 2, height: h - padding * 2 - bottomH - gap }];
        }

        const topH = h - padding * 2 - bottomH - gap;
        const mainW = (w - padding * 2) * 0.6;
        const sideW = (w - padding * 2) * 0.4 - gap;

        const result = [
          { x: padding, y: padding, width: mainW, height: topH },
          { x: padding + mainW + gap, y: padding, width: sideW, height: topH },
        ];

        const bottomCount = Math.min(count - 2, 4);
        if (bottomCount > 0) {
          const cellW = (w - padding * 2 - gap * (bottomCount - 1)) / bottomCount;
          for (let i = 0; i < bottomCount; i++) {
            result.push({
              x: padding + i * (cellW + gap),
              y: padding + topH + gap,
              width: cellW,
              height: bottomH,
            });
          }
        }

        return result;
      },
    };

    function calculateLayout(participants, layout) {
      const onStage = participants.filter(p => p.isOnStage);
      const layoutFn = LAYOUTS[layout] || LAYOUTS.grid;
      return layoutFn(onStage.length);
    }

    // ==========================================================================
    // DOM RENDERING
    // ==========================================================================

    function render() {
      renderBackground();
      renderParticipants();
      renderOverlays();
    }

    function renderBackground() {
      const layer = document.getElementById('background-layer');
      layer.innerHTML = '';
      layer.className = '';
      layer.style.cssText = '';

      switch (state.backgroundType) {
        case 'color':
          layer.className = 'color';
          layer.style.setProperty('--bg-color', state.backgroundColor);
          break;
        case 'image':
          if (state.backgroundUrl) {
            const img = document.createElement('img');
            img.src = state.backgroundUrl;
            layer.appendChild(img);
          }
          break;
        case 'video':
          if (state.backgroundUrl) {
            const video = document.createElement('video');
            video.src = state.backgroundUrl;
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            layer.appendChild(video);
          }
          break;
      }
    }

    function renderParticipants() {
      const layer = document.getElementById('participants-layer');
      const onStage = state.participants.filter(p => p.isOnStage);
      const positions = calculateLayout(state.participants, state.layout);

      // Remove tiles for participants no longer on stage
      const existingTiles = layer.querySelectorAll('.participant-tile');
      existingTiles.forEach(tile => {
        const id = tile.dataset.participantId;
        if (!onStage.find(p => p.id === id)) {
          tile.remove();
        }
      });

      // Update or create tiles
      onStage.forEach((participant, index) => {
        const pos = positions[index];
        if (!pos) return;

        let tile = layer.querySelector(`[data-participant-id="${participant.id}"]`);

        if (!tile) {
          tile = createParticipantTile(participant);
          layer.appendChild(tile);
        }

        // Update position
        tile.style.left = `${pos.x}px`;
        tile.style.top = `${pos.y}px`;
        tile.style.width = `${pos.width}px`;
        tile.style.height = `${pos.height}px`;

        // Update border
        if (participant.borderColor) {
          tile.classList.add('has-border');
          tile.style.setProperty('--border-color', participant.borderColor);
        } else {
          tile.classList.remove('has-border');
        }

        // Update video/avatar
        updateParticipantContent(tile, participant);

        // Update name tag
        const nameTag = tile.querySelector('.name-tag');
        if (nameTag) nameTag.textContent = participant.name;

        // Update muted icon
        const mutedIcon = tile.querySelector('.muted-icon');
        if (mutedIcon) {
          mutedIcon.style.display = participant.audioEnabled ? 'none' : 'flex';
        }
      });
    }

    function createParticipantTile(participant) {
      const tile = document.createElement('div');
      tile.className = 'participant-tile';
      tile.dataset.participantId = participant.id;

      tile.innerHTML = `
        <div class="video-container"></div>
        <div class="avatar" style="display: none;">
          <span class="avatar-letter">${participant.name.charAt(0).toUpperCase()}</span>
        </div>
        <div class="name-tag">${participant.name}</div>
        <div class="muted-icon" style="display: none;">
          <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </div>
      `;

      return tile;
    }

    function updateParticipantContent(tile, participant) {
      const videoContainer = tile.querySelector('.video-container');
      const avatar = tile.querySelector('.avatar');
      const stream = state.streams.get(participant.streamId);

      if (participant.videoEnabled && stream) {
        avatar.style.display = 'none';

        let video = videoContainer.querySelector('video');
        if (!video) {
          video = document.createElement('video');
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          videoContainer.appendChild(video);
        }

        if (video.srcObject !== stream) {
          video.srcObject = stream;
        }
        videoContainer.style.display = 'block';
      } else {
        videoContainer.style.display = 'none';
        avatar.style.display = 'flex';

        // Update avatar letter
        const letter = avatar.querySelector('.avatar-letter');
        if (letter) letter.textContent = participant.name.charAt(0).toUpperCase();
      }
    }

    function renderOverlays() {
      // Live indicator
      const liveIndicator = document.getElementById('live-indicator');
      liveIndicator.classList.toggle('visible', state.isLive);

      // Logo
      const logo = document.getElementById('logo-overlay');
      if (state.logoUrl && state.logoVisible) {
        logo.src = state.logoUrl;
        logo.classList.add('visible');
      } else {
        logo.classList.remove('visible');
      }

      // Lower third
      const lowerThird = document.getElementById('lower-third');
      const ltTitle = lowerThird.querySelector('.title');
      const ltSubtitle = lowerThird.querySelector('.subtitle');

      if (state.lowerThird.visible) {
        ltTitle.textContent = state.lowerThird.title;
        ltSubtitle.textContent = state.lowerThird.subtitle;
        lowerThird.classList.add('visible');
      } else {
        lowerThird.classList.remove('visible');
      }

      // Ticker
      const ticker = document.getElementById('ticker');
      const tickerContent = ticker.querySelector('.ticker-content');

      if (state.ticker.visible && state.ticker.text) {
        tickerContent.textContent = state.ticker.text;
        ticker.classList.add('visible');
      } else {
        ticker.classList.remove('visible');
      }

      // Countdown
      const countdown = document.getElementById('countdown');
      if (state.countdown.visible && state.countdown.seconds > 0) {
        countdown.textContent = state.countdown.seconds;
        countdown.classList.add('visible');
      } else {
        countdown.classList.remove('visible');
      }
    }

    // ==========================================================================
    // CANVAS OUTPUT + AUDIO MIXER - COMPOSITE RENDERING
    // ==========================================================================

    function initOutputCanvas() {
      outputCanvas = document.createElement('canvas');
      outputCanvas.width = 1920;
      outputCanvas.height = 1080;
      outputCanvas.style.display = 'none';
      document.body.appendChild(outputCanvas);
      outputCtx = outputCanvas.getContext('2d', { willReadFrequently: false });

      // Web Audio context for mixing participant audio
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      audioDestination = audioContext.createMediaStreamDestination();
      audioMixer = audioContext.createGain();
      audioMixer.gain.value = 1.0;
      audioMixer.connect(audioDestination);

      console.log('[Compositor] Canvas and audio mixer initialized');
    }

    function renderToCanvas() {
      if (!outputCtx) return;

      const W = 1920, H = 1080;

      // Background
      if (state.backgroundType === 'color') {
        outputCtx.fillStyle = state.backgroundColor || '#1a1a2e';
        outputCtx.fillRect(0, 0, W, H);
      } else {
        outputCtx.fillStyle = '#000';
        outputCtx.fillRect(0, 0, W, H);
      }

      // Participants
      const onStage = state.participants.filter(p => p.isOnStage);
      const positions = calculateLayout(state.participants, state.layout);

      onStage.forEach((participant, index) => {
        const pos = positions[index];
        if (!pos) return;

        const videoEl = state.videoElements.get(participant.streamId);

        if (participant.videoEnabled && videoEl && videoEl.readyState >= 2) {
          // Draw video frame
          outputCtx.drawImage(videoEl, pos.x, pos.y, pos.width, pos.height);
        } else {
          // Draw avatar gradient
          const grad = outputCtx.createLinearGradient(pos.x, pos.y, pos.x + pos.width, pos.y + pos.height);
          grad.addColorStop(0, '#667eea');
          grad.addColorStop(1, '#764ba2');
          outputCtx.fillStyle = grad;
          outputCtx.beginPath();
          const r = 16;
          outputCtx.moveTo(pos.x + r, pos.y);
          outputCtx.lineTo(pos.x + pos.width - r, pos.y);
          outputCtx.arcTo(pos.x + pos.width, pos.y, pos.x + pos.width, pos.y + r, r);
          outputCtx.lineTo(pos.x + pos.width, pos.y + pos.height - r);
          outputCtx.arcTo(pos.x + pos.width, pos.y + pos.height, pos.x + pos.width - r, pos.y + pos.height, r);
          outputCtx.lineTo(pos.x + r, pos.y + pos.height);
          outputCtx.arcTo(pos.x, pos.y + pos.height, pos.x, pos.y + pos.height - r, r);
          outputCtx.lineTo(pos.x, pos.y + r);
          outputCtx.arcTo(pos.x, pos.y, pos.x + r, pos.y, r);
          outputCtx.closePath();
          outputCtx.fill();

          // Avatar letter
          const fontSize = Math.min(pos.width, pos.height) * 0.35;
          outputCtx.fillStyle = 'white';
          outputCtx.font = `bold ${fontSize}px -apple-system, sans-serif`;
          outputCtx.textAlign = 'center';
          outputCtx.textBaseline = 'middle';
          outputCtx.fillText(participant.name.charAt(0).toUpperCase(), pos.x + pos.width / 2, pos.y + pos.height / 2);
        }

        // Name tag
        const tagText = participant.name;
        const tagPad = 12;
        const tagH = 36;
        outputCtx.font = 'bold 18px -apple-system, sans-serif';
        const tagW = Math.min(outputCtx.measureText(tagText).width + tagPad * 2, pos.width - 32);
        outputCtx.fillStyle = 'rgba(0,0,0,0.75)';
        outputCtx.beginPath();
        outputCtx.roundRect(pos.x + 16, pos.y + pos.height - tagH - 16, tagW, tagH, 8);
        outputCtx.fill();
        outputCtx.fillStyle = 'white';
        outputCtx.textAlign = 'left';
        outputCtx.textBaseline = 'middle';
        outputCtx.fillText(tagText, pos.x + 16 + tagPad, pos.y + pos.height - tagH / 2 - 16, tagW - tagPad * 2);

        // Muted indicator
        if (!participant.audioEnabled) {
          outputCtx.fillStyle = 'rgba(239,68,68,0.9)';
          outputCtx.beginPath();
          outputCtx.arc(pos.x + pos.width - 34, pos.y + 34, 18, 0, Math.PI * 2);
          outputCtx.fill();
        }
      });

      // Live indicator overlay
      if (state.isLive) {
        outputCtx.fillStyle = '#ef4444';
        outputCtx.beginPath();
        outputCtx.roundRect(32, 32, 90, 42, 8);
        outputCtx.fill();
        outputCtx.fillStyle = 'white';
        outputCtx.font = 'bold 16px -apple-system, sans-serif';
        outputCtx.textAlign = 'center';
        outputCtx.textBaseline = 'middle';
        outputCtx.fillText('● LIVE', 77, 53);
      }

      // Lower third overlay
      if (state.lowerThird.visible && state.lowerThird.title) {
        const ltX = 80, ltY = H - 200, ltW = 700;
        outputCtx.fillStyle = 'rgba(102,126,234,0.92)';
        outputCtx.beginPath();
        outputCtx.roundRect(ltX, ltY, ltW, state.lowerThird.subtitle ? 90 : 60, 12);
        outputCtx.fill();
        outputCtx.fillStyle = 'white';
        outputCtx.font = 'bold 28px -apple-system, sans-serif';
        outputCtx.textAlign = 'left';
        outputCtx.textBaseline = 'top';
        outputCtx.fillText(state.lowerThird.title, ltX + 24, ltY + 12);
        if (state.lowerThird.subtitle) {
          outputCtx.font = '18px -apple-system, sans-serif';
          outputCtx.globalAlpha = 0.9;
          outputCtx.fillText(state.lowerThird.subtitle, ltX + 24, ltY + 48);
          outputCtx.globalAlpha = 1;
        }
      }
    }

    function startCanvasRenderLoop() {
      if (canvasRenderLoop) return;
      console.log('[Compositor] Starting canvas render loop at 30fps');
      canvasRenderLoop = setInterval(renderToCanvas, 1000 / 30);
    }

    function stopCanvasRenderLoop() {
      if (canvasRenderLoop) {
        clearInterval(canvasRenderLoop);
        canvasRenderLoop = null;
      }
    }

    // ==========================================================================
    // ANT MEDIA - SUBSCRIBE TO STREAMS (one WebSocket per stream)
    // ==========================================================================

    function subscribeToStream(streamId) {
      if (!streamId || streamWebSockets.has(streamId)) return;
      console.log('[AntMedia] Subscribing to stream:', streamId);

      const ws = new WebSocket(CONFIG.antmediaWs);
      streamWebSockets.set(streamId, ws);

      const pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'turn:turn.streamlick.com:3478', username: 'streamlick', credential: 'Str3aml1ck_TURN_2026!xK9m' },
        ],
      });
      streamPeerConnections.set(streamId, pc);

      pc.ontrack = (event) => {
        console.log('[AntMedia] Track received for stream:', streamId);
        const stream = event.streams[0];
        state.streams.set(streamId, stream);

        // Create video element for canvas drawing
        const video = document.createElement('video');
        video.srcObject = stream;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        state.videoElements.set(streamId, video);

        // Mix audio into composite output
        if (audioContext && audioMixer && stream.getAudioTracks().length > 0) {
          try {
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(audioMixer);
            audioSources.set(streamId, source);
          } catch (e) {
            console.warn('[Compositor] Audio mix error:', e);
          }
        }

        render(); // Update DOM display too
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            command: 'takeCandidate',
            streamId,
            label: event.candidate.sdpMLineIndex,
            id: event.candidate.sdpMid,
            candidate: event.candidate.candidate,
          }));
        }
      };

      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });

      ws.onopen = () => {
        ws.send(JSON.stringify({ command: 'play', streamId, token: '' }));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        switch (msg.command) {
          case 'start':
            // AMS sends offer for play mode
            if (msg.sdp) {
              try {
                await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: msg.sdp }));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({
                  command: 'takeConfiguration',
                  streamId,
                  type: 'answer',
                  sdp: pc.localDescription.sdp,
                }));
              } catch (err) {
                console.error('[AntMedia] SDP error for stream', streamId, err);
              }
            }
            break;
          case 'takeCandidate':
            try {
              await pc.addIceCandidate(new RTCIceCandidate({
                sdpMLineIndex: msg.label,
                candidate: msg.candidate,
              }));
            } catch (e) {}
            break;
          case 'notification':
            console.log('[AntMedia] Stream', streamId, 'notification:', msg.definition);
            break;
          case 'error':
            console.error('[AntMedia] Stream', streamId, 'error:', msg.definition);
            break;
        }
      };

      ws.onclose = () => {
        console.log('[AntMedia] Stream WebSocket closed for:', streamId);
      };
    }

    function unsubscribeFromStream(streamId) {
      const pc = streamPeerConnections.get(streamId);
      if (pc) { pc.close(); streamPeerConnections.delete(streamId); }

      const ws = streamWebSockets.get(streamId);
      if (ws) { ws.close(); streamWebSockets.delete(streamId); }

      const source = audioSources.get(streamId);
      if (source) { source.disconnect(); audioSources.delete(streamId); }

      const videoEl = state.videoElements.get(streamId);
      if (videoEl) { videoEl.srcObject = null; state.videoElements.delete(streamId); }

      state.streams.delete(streamId);
    }

    // ==========================================================================
    // ANT MEDIA - PUBLISH COMPOSITE OUTPUT
    // ==========================================================================

    function startCompositeOutput() {
      if (isPublishing) {
        console.log('[Compositor] Already publishing composite output');
        return;
      }

      if (!outputCanvas) {
        console.error('[Compositor] Canvas not initialized');
        return;
      }

      // Resume audio context if suspended
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume().catch(console.error);
      }

      // Start canvas render loop
      startCanvasRenderLoop();

      // Create composite MediaStream: canvas video + mixed audio
      const videoStream = outputCanvas.captureStream(30);
      const compositeStream = new MediaStream([
        ...videoStream.getVideoTracks(),
        ...audioDestination.stream.getAudioTracks(),
      ]);

      // Generate unique output stream ID
      outputStreamId = 'composite_' + CONFIG.broadcastId;
      console.log('[Compositor] Publishing composite stream:', outputStreamId);

      publishWs = new WebSocket(CONFIG.antmediaWs);
      publishPc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'turn:turn.streamlick.com:3478', username: 'streamlick', credential: 'Str3aml1ck_TURN_2026!xK9m' },
        ],
      });

      // Add composite tracks to publish connection
      compositeStream.getTracks().forEach(track => {
        publishPc.addTrack(track, compositeStream);
      });

      publishPc.onicecandidate = (event) => {
        if (event.candidate && publishWs.readyState === WebSocket.OPEN) {
          publishWs.send(JSON.stringify({
            command: 'takeCandidate',
            streamId: outputStreamId,
            label: event.candidate.sdpMLineIndex,
            id: event.candidate.sdpMid,
            candidate: event.candidate.candidate,
          }));
        }
      };

      publishWs.onopen = () => {
        console.log('[Compositor] Publish WebSocket open, sending publish command');
        publishWs.send(JSON.stringify({
          command: 'publish',
          streamId: outputStreamId,
          token: '',
          video: true,
          audio: true,
        }));
      };

      publishWs.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        switch (msg.command) {
          case 'start':
            // AMS ready to receive - create and send offer
            try {
              const offer = await publishPc.createOffer();
              await publishPc.setLocalDescription(offer);
              publishWs.send(JSON.stringify({
                command: 'takeConfiguration',
                streamId: outputStreamId,
                type: 'offer',
                sdp: publishPc.localDescription.sdp,
              }));
            } catch (err) {
              console.error('[Compositor] Publish offer error:', err);
            }
            break;

          case 'takeConfiguration':
            if (msg.type === 'answer') {
              try {
                await publishPc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: msg.sdp }));
                console.log('[Compositor] Publish WebRTC connected');
              } catch (err) {
                console.error('[Compositor] Publish answer error:', err);
              }
            }
            break;

          case 'takeCandidate':
            try {
              await publishPc.addIceCandidate(new RTCIceCandidate({
                sdpMLineIndex: msg.label,
                candidate: msg.candidate,
              }));
            } catch (e) {}
            break;

          case 'notification':
            console.log('[Compositor] Publish notification:', msg.definition);
            if (msg.definition === 'publish_started') {
              isPublishing = true;
              console.log('[Compositor] Composite stream is LIVE on AMS:', outputStreamId);
              // Notify backend that composite output is ready
              if (backendSocket && backendSocket.connected) {
                backendSocket.emit('composite-ready', {
                  broadcastId: CONFIG.broadcastId,
                  streamId: outputStreamId,
                });
              }
            } else if (msg.definition === 'publish_finished') {
              isPublishing = false;
              console.log('[Compositor] Composite stream ended');
            }
            break;

          case 'error':
            console.error('[Compositor] Publish error:', msg.definition);
            if (msg.definition === 'streamIdInUse') {
              // Stop old stream and retry with same ID
              publishWs.send(JSON.stringify({ command: 'stop', streamId: outputStreamId }));
              setTimeout(startCompositeOutput, 2000);
            }
            break;
        }
      };

      publishWs.onclose = () => {
        console.log('[Compositor] Publish WebSocket closed');
        isPublishing = false;
        // Reconnect if still live
        if (state.isLive) {
          console.log('[Compositor] Reconnecting publish in 3s...');
          setTimeout(startCompositeOutput, 3000);
        }
      };
    }

    function stopCompositeOutput() {
      stopCanvasRenderLoop();

      if (publishWs && publishWs.readyState === WebSocket.OPEN) {
        publishWs.send(JSON.stringify({ command: 'stop', streamId: outputStreamId }));
        publishWs.close();
      }
      publishWs = null;

      if (publishPc) { publishPc.close(); publishPc = null; }
      isPublishing = false;
    }

    // ==========================================================================
    // BACKEND SOCKET.IO - RECEIVE COMMANDS
    // ==========================================================================

    let backendSocket = null;

    function connectToBackend() {
      console.log('[Backend] Connecting to:', CONFIG.backendWs);

      backendSocket = io(CONFIG.backendWs, {
        auth: {
          isCompositor: true,
          compositorSecret: CONFIG.compositorSecret,
        },
        reconnection: true,
        reconnectionDelay: 1000,
        reconnectionAttempts: Infinity,
      });

      backendSocket.on('connect', () => {
        console.log('[Backend] Connected');
        backendSocket.emit('compositor-join', CONFIG.broadcastId);
      });

      backendSocket.on('disconnect', () => {
        console.log('[Backend] Disconnected');
      });

      backendSocket.on('connect_error', (err) => {
        console.error('[Backend] Connection error:', err.message);
      });

      // Register all event handlers
      backendSocket.on('full-state', (data) => handleBackendMessage({ type: 'full-state', ...data }));
      backendSocket.on('set-layout', (data) => handleBackendMessage({ type: 'set-layout', ...data }));
      backendSocket.on('set-background', (data) => handleBackendMessage({ type: 'set-background', ...data }));
      backendSocket.on('participant-added', (data) => handleBackendMessage({ type: 'participant-added', ...data }));
      backendSocket.on('participant-removed', (data) => handleBackendMessage({ type: 'participant-removed', ...data }));
      backendSocket.on('participant-updated', (data) => handleBackendMessage({ type: 'participant-updated', ...data }));
      backendSocket.on('bring-on-stage', (data) => handleBackendMessage({ type: 'bring-on-stage', ...data }));
      backendSocket.on('remove-from-stage', (data) => handleBackendMessage({ type: 'remove-from-stage', ...data }));
      backendSocket.on('set-logo', (data) => handleBackendMessage({ type: 'set-logo', ...data }));
      backendSocket.on('set-lower-third', (data) => handleBackendMessage({ type: 'set-lower-third', ...data }));
      backendSocket.on('set-ticker', (data) => handleBackendMessage({ type: 'set-ticker', ...data }));
      backendSocket.on('set-countdown', (data) => handleBackendMessage({ type: 'set-countdown', ...data }));
      backendSocket.on('go-live', () => handleBackendMessage({ type: 'go-live' }));
      backendSocket.on('end-broadcast', () => handleBackendMessage({ type: 'end-broadcast' }));
    }

    function handleBackendMessage(msg) {
      console.log('[Backend] Received:', msg.type, msg);

      switch (msg.type) {
        case 'full-state':
          Object.assign(state, msg.state);
          // Subscribe to any new streams
          state.participants.filter(p => p.isOnStage && p.streamId).forEach(p => {
            subscribeToStream(p.streamId);
          });
          render();
          break;

        case 'set-layout':
          state.layout = msg.layout;
          render();
          break;

        case 'set-background':
          state.backgroundType = msg.backgroundType || 'color';
          state.backgroundColor = msg.backgroundColor || '#1a1a2e';
          state.backgroundUrl = msg.backgroundUrl || null;
          render();
          break;

        case 'participant-added':
          state.participants.push(msg.participant);
          if (msg.participant.isOnStage && msg.participant.streamId) {
            subscribeToStream(msg.participant.streamId);
          }
          render();
          break;

        case 'participant-removed':
          const idx = state.participants.findIndex(p => p.id === msg.participantId);
          if (idx >= 0) {
            const p = state.participants[idx];
            if (p.streamId) unsubscribeFromStream(p.streamId);
            state.participants.splice(idx, 1);
          }
          render();
          break;

        case 'participant-updated':
          const pIdx = state.participants.findIndex(p => p.id === msg.participant.id);
          if (pIdx >= 0) {
            const oldP = state.participants[pIdx];
            const newP = { ...oldP, ...msg.participant };

            // Handle stream subscription changes
            if (newP.isOnStage && newP.streamId && !state.streams.has(newP.streamId)) {
              subscribeToStream(newP.streamId);
            } else if (!newP.isOnStage && oldP.streamId) {
              unsubscribeFromStream(oldP.streamId);
            }

            state.participants[pIdx] = newP;
          }
          render();
          break;

        case 'bring-on-stage':
          const bringP = state.participants.find(p => p.id === msg.participantId);
          if (bringP) {
            bringP.isOnStage = true;
            if (bringP.streamId) subscribeToStream(bringP.streamId);
          }
          render();
          break;

        case 'remove-from-stage':
          const removeP = state.participants.find(p => p.id === msg.participantId);
          if (removeP) {
            removeP.isOnStage = false;
            if (removeP.streamId) unsubscribeFromStream(removeP.streamId);
          }
          render();
          break;

        case 'set-logo':
          state.logoUrl = msg.logoUrl;
          state.logoVisible = msg.visible !== false;
          render();
          break;

        case 'set-lower-third':
          state.lowerThird = {
            visible: msg.visible !== false,
            title: msg.title || '',
            subtitle: msg.subtitle || '',
          };
          render();
          break;

        case 'set-ticker':
          state.ticker = {
            visible: msg.visible !== false,
            text: msg.text || '',
          };
          render();
          break;

        case 'set-countdown':
          state.countdown = {
            visible: msg.visible !== false,
            seconds: msg.seconds || 0,
          };
          render();

          // Auto-countdown
          if (msg.visible && msg.seconds > 0) {
            const interval = setInterval(() => {
              state.countdown.seconds--;
              if (state.countdown.seconds <= 0) {
                state.countdown.visible = false;
                clearInterval(interval);
              }
              render();
            }, 1000);
          }
          break;

        case 'go-live':
          state.isLive = true;
          render();
          startCompositeOutput();
          break;

        case 'end-broadcast':
          state.isLive = false;
          render();
          stopCompositeOutput();
          break;
      }
    }

    // ==========================================================================
    // INITIALIZATION
    // ==========================================================================

    function init() {
      console.log('[Compositor] Initializing with config:', CONFIG);
      initOutputCanvas();
      render();
      connectToBackend();
      // NOTE: We do NOT pre-connect to AMS here.
      // Stream subscriptions happen on demand as participants join.
      // Composite output starts when 'go-live' is received.
    }

    // Expose API for testing/debugging
    window.CompositorAPI = {
      getState: () => state,
      setState: (newState) => { Object.assign(state, newState); render(); },
      setLayout: (layout) => { state.layout = layout; render(); },
      setBackground: (type, colorOrUrl) => {
        state.backgroundType = type;
        if (type === 'color') state.backgroundColor = colorOrUrl;
        else state.backgroundUrl = colorOrUrl;
        render();
      },
      addTestParticipant: (name) => {
        state.participants.push({
          id: 'test-' + Date.now(),
          name,
          streamId: null,
          isOnStage: true,
          audioEnabled: true,
          videoEnabled: false,
          borderColor: '#10b981',
        });
        render();
      },
      render,
    };

    // Start
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
