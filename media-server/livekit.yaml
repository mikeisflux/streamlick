# LiveKit Server Configuration for StreamLick
# https://docs.livekit.io/realtime/self-hosting/deployment/

port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  # Use your actual server IP/domain
  # node_ip: 178.156.200.171
  use_external_ip: true

# API keys - CHANGE THESE IN PRODUCTION!
keys:
  devkey: secret

# Redis for multi-node (optional for single node)
# redis:
#   address: redis:6379

# Enable room recording
room:
  enabled_codecs:
    - mime: audio/opus
    - mime: video/VP8
    - mime: video/H264
  max_participants: 20
  empty_timeout: 300  # 5 minutes

# Logging
logging:
  level: info
  pion_level: warn

# TURN server (built-in)
turn:
  enabled: true
  udp_port: 3478
  tls_port: 5349

# Webhooks (optional - for backend notifications)
# webhook:
#   api_key: your-webhook-key
#   urls:
#     - https://your-backend.com/api/livekit/webhook

# Region for geo-routing (optional)
# region: us-west-2
