<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StreamLick Composite Layout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: #000;
    }
    #container {
      position: relative;
      width: 1920px;
      height: 1080px;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background-color: #111;
    }
    .hidden-video {
      position: fixed !important;
      top: -9999px !important;
      left: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #0f0;
      font-family: monospace;
      font-size: 14px;
      z-index: 1000;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border-radius: 5px;
      max-width: 400px;
    }
    #status.error { color: #f00; }
    #status.warning { color: #ff0; }
    #status.success { color: #0f0; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="canvas" width="1920" height="1080"></canvas>
  </div>
  <div id="status">Initializing...</div>

  <!-- WebRTC Adapter for browser compatibility -->
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>

  <script type="module">
    // ========================================
    // Import Ant Media SDK
    // ========================================
    import { WebRTCAdaptor } from './js/webrtc_adaptor.js';

    // ========================================
    // Configuration
    // ========================================
    const CANVAS_WIDTH = 1920;
    const CANVAS_HEIGHT = 1080;
    const FPS = 30;
    const WS_URL = 'wss://media.streamlick.com:5443/LiveApp/websocket';

    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId');
    const initialLayout = parseInt(urlParams.get('layout')) || 3;
    const initialBackground = urlParams.get('bg') || null;

    // ========================================
    // State
    // ========================================
    let currentLayout = initialLayout;
    let backgroundImage = null;
    let participants = []; // Array of { id, streamId, stream, videoElement, name, videoEnabled }
    let webRTCAdaptor = null;
    let isPublishing = false;
    let isJoined = false;
    let compositeStreamId = null;
    let canvasStream = null;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function updateStatus(message, type = 'info') {
      console.log(`[Composite] ${message}`);
      statusEl.textContent = message;
      statusEl.className = type;
    }

    // ========================================
    // Layout Engine (from layoutEngine.ts)
    // ========================================
    function calculateLayoutPositions(layout, count) {
      const positions = [];
      if (count === 0) return positions;

      switch (layout) {
        case 1: // Solo
          if (count === 1) {
            const w = CANVAS_WIDTH * 0.6;
            const h = w * (9/16);
            positions.push({ x: (CANVAS_WIDTH-w)/2, y: (CANVAS_HEIGHT-h)/2, width: w, height: h });
          } else {
            return calculateGridPositions(count);
          }
          break;
        case 2: // 2x2 Cropped
          const cols2 = 2, rows2 = 2;
          const bw2 = CANVAS_WIDTH/cols2, bh2 = CANVAS_HEIGHT/rows2;
          for (let i = 0; i < count && i < 4; i++) {
            positions.push({ x: (i%cols2)*bw2, y: Math.floor(i/cols2)*bh2, width: bw2, height: bh2 });
          }
          break;
        case 3: // Group (auto grid)
          return calculateGridPositions(count);
        case 4: // Spotlight
          if (count === 1) {
            positions.push({ x: 0, y: 0, width: CANVAS_WIDTH, height: CANVAS_HEIGHT });
          } else {
            const topH = CANVAS_HEIGHT * 0.25;
            const mainH = CANVAS_HEIGHT * 0.75;
            positions.push({ x: 0, y: topH, width: CANVAS_WIDTH, height: mainH });
            const thumbW = CANVAS_WIDTH / Math.min(3, count-1);
            for (let i = 1; i < count; i++) {
              positions.push({ x: (i-1)*thumbW, y: 0, width: thumbW, height: topH });
            }
          }
          break;
        case 5: // News (side by side)
          const newsW = CANVAS_WIDTH / Math.max(2, count);
          for (let i = 0; i < count; i++) {
            positions.push({ x: i*newsW, y: 0, width: newsW, height: CANVAS_HEIGHT });
          }
          break;
        default:
          return calculateGridPositions(count);
      }
      return positions;
    }

    function calculateGridPositions(count) {
      const positions = [];
      if (count === 0) return positions;
      const cols = Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count / cols);
      const bw = CANVAS_WIDTH / cols;
      const bh = CANVAS_HEIGHT / rows;
      for (let i = 0; i < count; i++) {
        positions.push({ x: (i%cols)*bw, y: Math.floor(i/cols)*bh, width: bw, height: bh });
      }
      return positions;
    }

    // ========================================
    // Canvas Rendering
    // ========================================
    let frameCount = 0;
    let lastStatTime = Date.now();

    function renderFrame() {
      frameCount++;
      const now = Date.now();

      // Log stats every 5 seconds
      if (now - lastStatTime > 5000) {
        const fps = Math.round(frameCount / 5);
        console.log(`[Composite] Stats: ${fps} fps, ${participants.length} participants, layout=${currentLayout}, publishing=${isPublishing}`);
        frameCount = 0;
        lastStatTime = now;
      }

      // Clear canvas
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Draw background
      if (backgroundImage && backgroundImage.complete && backgroundImage.naturalWidth > 0) {
        ctx.drawImage(backgroundImage, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      }

      // Calculate positions
      const positions = calculateLayoutPositions(currentLayout, participants.length);

      // Draw participants
      participants.forEach((p, i) => {
        if (i >= positions.length) return;
        const pos = positions[i];
        const video = p.videoElement;
        const cornerRadius = 12;

        // Rounded rect clip helper
        function roundRect(x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x+r, y);
          ctx.lineTo(x+w-r, y);
          ctx.quadraticCurveTo(x+w, y, x+w, y+r);
          ctx.lineTo(x+w, y+h-r);
          ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
          ctx.lineTo(x+r, y+h);
          ctx.quadraticCurveTo(x, y+h, x, y+h-r);
          ctx.lineTo(x, y+r);
          ctx.quadraticCurveTo(x, y, x+r, y);
          ctx.closePath();
        }

        const canDraw = video && video.readyState >= 2 && video.videoWidth > 0 && p.videoEnabled !== false;

        if (canDraw) {
          // Calculate aspect-preserving dimensions
          const vAspect = video.videoWidth / video.videoHeight;
          const bAspect = pos.width / pos.height;
          let dw, dh, dx, dy;
          if (vAspect > bAspect) {
            dh = pos.height; dw = dh * vAspect;
            dx = pos.x - (dw - pos.width) / 2; dy = pos.y;
          } else {
            dw = pos.width; dh = dw / vAspect;
            dx = pos.x; dy = pos.y - (dh - pos.height) / 2;
          }

          ctx.save();
          roundRect(pos.x, pos.y, pos.width, pos.height, cornerRadius);
          ctx.clip();
          ctx.drawImage(video, dx, dy, dw, dh);
          ctx.restore();
        } else {
          // Placeholder tile
          ctx.save();
          roundRect(pos.x, pos.y, pos.width, pos.height, cornerRadius);
          ctx.clip();
          ctx.fillStyle = '#1e2330';
          ctx.fillRect(pos.x, pos.y, pos.width, pos.height);
          ctx.restore();

          // Avatar circle (30%)
          const cx = pos.x + pos.width/2, cy = pos.y + pos.height/2;
          const size = Math.min(pos.width, pos.height) * 0.3;
          const r = size / 2;

          ctx.beginPath();
          ctx.arc(cx, cy, r+2, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(255,255,255,0.1)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI*2);
          ctx.fillStyle = '#374151';
          ctx.fill();

          const name = p.name || 'Guest';
          ctx.fillStyle = '#fff';
          ctx.font = `bold ${Math.min(r*0.8, 60)}px system-ui, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(name.charAt(0).toUpperCase(), cx, cy);
        }

        // Name tag
        const displayName = p.name || 'Guest';
        const tagH = 28, tagPad = 12;
        const tagY = pos.y + pos.height - tagH - 12;
        const tagX = pos.x + 12;
        ctx.font = 'bold 14px system-ui, sans-serif';
        const tw = ctx.measureText(displayName).width;
        const tagW = tw + tagPad * 2;
        const tagR = tagH / 2;

        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.beginPath();
        ctx.moveTo(tagX+tagR, tagY);
        ctx.lineTo(tagX+tagW-tagR, tagY);
        ctx.arc(tagX+tagW-tagR, tagY+tagR, tagR, -Math.PI/2, Math.PI/2);
        ctx.lineTo(tagX+tagR, tagY+tagH);
        ctx.arc(tagX+tagR, tagY+tagR, tagR, Math.PI/2, -Math.PI/2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(displayName, tagX+tagPad, tagY+tagH/2);
      });

      // Status overlay (top-left)
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(8, 8, 350, 24);
      ctx.fillStyle = isPublishing ? '#0f0' : '#f00';
      ctx.font = '12px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${isPublishing ? '● LIVE' : '○ OFFLINE'} | Participants: ${participants.length} | Layout: ${currentLayout}`, 14, 20);

      requestAnimationFrame(renderFrame);
    }

    // ========================================
    // WebRTC - Mirroring webrtc.service.ts approach
    // ========================================
    function initWebRTC() {
      if (!roomId) {
        updateStatus('ERROR: No roomId in URL', 'error');
        return;
      }

      // Use same stream ID format as host: roomId_participantId
      compositeStreamId = `${roomId}_composite`;
      updateStatus(`Connecting to room: ${roomId}`, 'warning');

      // Capture canvas BEFORE creating adaptor
      canvasStream = canvas.captureStream(FPS);
      console.log('[Composite] Canvas stream captured:', canvasStream.getTracks().map(t => t.kind));

      webRTCAdaptor = new WebRTCAdaptor({
        websocket_url: WS_URL,
        mediaConstraints: { video: false, audio: false },
        localStream: canvasStream,
        peerconnection_config: {
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        },
        sdp_constraints: {
          OfferToReceiveAudio: true,
          OfferToReceiveVideo: true
        },
        callback: handleCallback,
        callbackError: handleError
      });
    }

    function handleCallback(info, obj) {
      console.log('[Composite] Callback:', info, obj);

      switch (info) {
        case 'initialized':
          updateStatus('WebSocket connected, joining room...', 'warning');
          // Join room in publish mode (same as webrtc.service.ts)
          webRTCAdaptor.joinRoom(roomId, compositeStreamId, 'publish');
          break;

        case 'joinedTheRoom':
          isJoined = true;
          updateStatus(`Joined room. Streams: ${obj.streams?.length || 0}`, 'warning');

          // Publish our canvas stream
          console.log('[Composite] Publishing canvas as:', compositeStreamId);
          webRTCAdaptor.publish(compositeStreamId, null, null, null, compositeStreamId, roomId);

          // Subscribe to existing streams
          if (obj.streams && obj.streams.length > 0) {
            obj.streams.forEach(streamId => {
              if (!streamId.includes('composite')) {
                console.log('[Composite] Subscribing to:', streamId);
                webRTCAdaptor.play(streamId, null, roomId);
              }
            });
          }
          break;

        case 'publish_started':
          isPublishing = true;
          updateStatus(`PUBLISHING: ${compositeStreamId}`, 'success');
          break;

        case 'publish_finished':
          isPublishing = false;
          updateStatus('Publishing stopped', 'warning');
          break;

        case 'newStreamAvailable':
          console.log('[Composite] New stream:', obj.streamId);
          if (!obj.streamId.includes('composite')) {
            addParticipant(obj.streamId, obj.stream);
          }
          break;

        case 'newTrackAvailable':
          console.log('[Composite] New track:', obj.streamId, obj.track?.kind);
          if (!obj.streamId.includes('composite') && obj.stream) {
            addParticipant(obj.streamId, obj.stream);
          }
          break;

        case 'subtrackAdded':
          // New participant joined room after us
          if (obj.trackId && !obj.trackId.includes('composite')) {
            console.log('[Composite] New subtrack, subscribing:', obj.trackId);
            webRTCAdaptor.play(obj.trackId, null, roomId);
          }
          break;

        case 'leavedFromRoom':
        case 'streamLeaved':
          const leftId = obj.streamId || obj;
          removeParticipant(leftId);
          break;

        case 'play_started':
          console.log('[Composite] Play started for:', obj.streamId);
          break;

        case 'ice_connection_state_changed':
          console.log('[Composite] ICE state:', obj.state, 'for', obj.streamId);
          break;

        case 'pong':
          // Heartbeat, ignore
          break;

        case 'bitrateMeasurement':
          // Track bitrate, ignore for now
          break;
      }
    }

    function handleError(error, message) {
      console.error('[Composite] Error:', error, message);
      updateStatus(`ERROR: ${error} - ${message}`, 'error');
    }

    function addParticipant(streamId, stream) {
      // Extract participant ID from stream ID (format: roomId_participantId)
      const parts = streamId.split('_');
      const participantId = parts.length >= 2 ? parts.slice(1).join('_') : streamId;

      // Check if already exists
      const existing = participants.find(p => p.id === participantId || p.streamId === streamId);
      if (existing) {
        console.log('[Composite] Updating existing participant:', participantId);
        existing.stream = stream;
        if (existing.videoElement) {
          existing.videoElement.srcObject = stream;
          existing.videoElement.play().catch(e => console.warn('Replay error:', e));
        }
        return;
      }

      console.log('[Composite] Adding new participant:', participantId, 'streamId:', streamId);

      // Create video element
      const video = document.createElement('video');
      video.className = 'hidden-video';
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.srcObject = stream;
      document.body.appendChild(video);

      // Play handlers
      video.onloadedmetadata = () => {
        console.log('[Composite] Video metadata loaded:', participantId, video.videoWidth, 'x', video.videoHeight);
        video.play().catch(e => console.warn('Play error:', e));
      };

      // Retry play after delay
      setTimeout(() => {
        if (video.paused && video.srcObject) {
          console.log('[Composite] Retrying play for:', participantId);
          video.play().catch(e => console.warn('Retry play error:', e));
        }
      }, 500);

      participants.push({
        id: participantId,
        streamId: streamId,
        stream: stream,
        videoElement: video,
        name: null,
        videoEnabled: true
      });

      updateStatus(`${participants.length} participant(s) | Publishing: ${isPublishing}`, isPublishing ? 'success' : 'warning');
    }

    function removeParticipant(streamId) {
      const parts = streamId.split('_');
      const participantId = parts.length >= 2 ? parts.slice(1).join('_') : streamId;

      const idx = participants.findIndex(p => p.id === participantId || p.streamId === streamId);
      if (idx !== -1) {
        const p = participants[idx];
        if (p.videoElement) {
          p.videoElement.srcObject = null;
          p.videoElement.remove();
        }
        participants.splice(idx, 1);
        console.log('[Composite] Removed participant:', participantId, 'Remaining:', participants.length);
        updateStatus(`${participants.length} participant(s)`, isPublishing ? 'success' : 'warning');
      }
    }

    // ========================================
    // External Control API
    // ========================================
    window.setBackground = function(url) {
      console.log('[Composite] Setting background:', url);
      if (!url) {
        backgroundImage = null;
        return;
      }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { backgroundImage = img; console.log('[Composite] Background loaded'); };
      img.onerror = () => console.error('[Composite] Background load failed:', url);
      img.src = url;
    };

    window.setLayout = function(id) {
      currentLayout = parseInt(id) || 3;
      console.log('[Composite] Layout set to:', currentLayout);
    };

    window.setParticipantName = function(id, name) {
      const p = participants.find(p => p.id === id);
      if (p) p.name = name;
    };

    window.setParticipantVideo = function(id, enabled) {
      const p = participants.find(p => p.id === id);
      if (p) p.videoEnabled = enabled;
    };

    window.getState = () => ({
      roomId,
      compositeStreamId,
      layout: currentLayout,
      isPublishing,
      isJoined,
      participantCount: participants.length,
      participants: participants.map(p => ({ id: p.id, name: p.name, videoEnabled: p.videoEnabled }))
    });

    // PostMessage handler
    window.addEventListener('message', (e) => {
      const { type, data } = e.data || {};
      if (type === 'setBackground') window.setBackground(data.url);
      if (type === 'setLayout') window.setLayout(data.layoutId);
      if (type === 'setParticipantName') window.setParticipantName(data.participantId, data.name);
      if (type === 'setParticipantVideo') window.setParticipantVideo(data.participantId, data.enabled);
    });

    // ========================================
    // Initialize
    // ========================================
    window.onload = () => {
      console.log('[Composite] Initializing...');
      console.log('[Composite] Room:', roomId);
      console.log('[Composite] Layout:', initialLayout);
      console.log('[Composite] Background:', initialBackground);

      if (initialBackground) {
        window.setBackground(initialBackground);
      }

      // Start render loop
      requestAnimationFrame(renderFrame);

      // Initialize WebRTC
      if (roomId) {
        initWebRTC();
      } else {
        updateStatus('ERROR: No roomId parameter', 'error');
      }
    };

    // Debug helpers
    window.debugParticipants = () => {
      participants.forEach((p, i) => {
        const v = p.videoElement;
        console.log(`P${i}:`, {
          id: p.id,
          streamId: p.streamId,
          readyState: v?.readyState,
          videoWidth: v?.videoWidth,
          videoHeight: v?.videoHeight,
          paused: v?.paused,
          tracks: p.stream?.getTracks().map(t => `${t.kind}:${t.readyState}`) || []
        });
      });
    };
  </script>
</body>
</html>
