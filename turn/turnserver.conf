# Coturn TURN Server Configuration for Streamlick
# See: https://github.com/coturn/coturn/wiki/turnserver

# Network settings
listening-port=3478
tls-listening-port=5349

# External IP - IMPORTANT: Replace with your server's public IP
# You can also use: external-ip=<public-ip>/<private-ip> for cloud providers
external-ip=${EXTERNAL_IP}

# Relay port range (must be open in firewall)
min-port=49152
max-port=65535

# Authentication
realm=${TURN_REALM:-turn.streamlick.com}
user=${TURN_USERNAME:-streamlick}:${TURN_PASSWORD:-changeme}

# Enable long-term credentials mechanism
lt-cred-mech

# TLS certificates (uncomment and set paths for TURNS)
# cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Security settings
fingerprint
no-software-attribute

# Disable multicast peers (security)
no-multicast-peers

# Don't let peers connect to private IPs
# This prevents TURN server from being used as a proxy
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Allow localhost for testing (remove in production if not needed)
allowed-peer-ip=127.0.0.1

# Quota settings (adjust based on your bandwidth)
# user-quota=100
# total-quota=300

# Max bandwidth per session (bytes per second)
# 0 = unlimited, 1000000 = ~1 Mbps
# max-bps=0

# Enable mobility (for mobile networks)
mobility

# Use STUN as well
stun-only=false

# CLI management (optional)
# cli-ip=127.0.0.1
# cli-port=5766
# cli-password=clipass
